[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/audio",
    "crates/sources",
    "crates/social",
    "crates/extras",
    "crates/platform",
    "apps/mini",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/slvx666/drxwnifyRustPC"
authors = ["DrxwnSlvt"]

[workspace.dependencies]
drx-core = { path = "crates/core" }
drx-audio = { path = "crates/audio" }
drx-sources = { path = "crates/sources" }
drx-social = { path = "crates/social" }
drx-extras = { path = "crates/extras" }
drx-platform = { path = "crates/platform" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

# Debug builds: optimise dependencies a little so audio decoding and the JS engine are usable while developing.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 16

# Mini release: small and lean. Checked against audio glitches in docs/PERFORMANCE.md.
[profile.release-mini]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
