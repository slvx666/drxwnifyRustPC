[workspace]
resolver = "3"
exclude = ["spikes", "vendor"]
members = [
    "crates/core",
    "crates/app",
    "crates/audio",
    "crates/catalog",
    "crates/resolver",
    "crates/library",
    "crates/lyrics",
    "crates/social",
    "crates/together",
    "crates/integrations",
    "crates/transfer",
    "crates/jobs",
    "crates/platform",
    "apps/mini",
    "apps/full/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/slvx666/drxwnifyRustPC"
authors = ["DrxwnSlvt"]

[workspace.dependencies]
drx-core = { path = "crates/core" }
drx-app = { path = "crates/app" }
drx-audio = { path = "crates/audio" }
drx-catalog = { path = "crates/catalog" }
drx-resolver = { path = "crates/resolver" }
drx-library = { path = "crates/library" }
drx-lyrics = { path = "crates/lyrics" }
drx-social = { path = "crates/social" }
drx-together = { path = "crates/together" }
drx-integrations = { path = "crates/integrations" }
drx-transfer = { path = "crates/transfer" }
drx-jobs = { path = "crates/jobs" }
drx-platform = { path = "crates/platform" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"

# Debug builds: optimise dependencies a little so audio decoding and the JS engine are usable while developing.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 16

# Mini release: small and lean. Checked against audio glitches in docs/PERFORMANCE.md.
[profile.release-mini]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Slint's winit backend with a fix for Windows: the software renderer presented only what changed in its scene, so
# a window whose pixels the system dropped (Alt+Tab from a fullscreen game, restore, display change) stayed
# transparent. Changes are marked «Drxwnify patch» in vendor/i-slint-backend-winit/renderer/sw.rs and
# winitwindowadapter.rs; drop this when upstream fixes it.
[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
