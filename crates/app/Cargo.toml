[package]
name = "drx-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
drx-core.workspace = true
drx-transfer.workspace = true
drx-audio.workspace = true
drx-catalog.workspace = true
drx-lyrics.workspace = true
drx-resolver.workspace = true
sha2 = "0.10"
md5 = { package = "md-5", version = "0.10" }
drx-social.workspace = true
drx-together.workspace = true
reqwest = { version = "0.13", default-features = false }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
