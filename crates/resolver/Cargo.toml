[package]
name = "drx-resolver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
drx-core.workspace = true
drx-catalog.workspace = true
# Only the Unicode tables the matcher needs (case folding, word boundaries and spaces, letters); no DFA engines.
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "unicode-gencat"] }
unicode-normalization = "0.1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"
async-trait = "0.1"
thiserror = "2"
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "test-util"] }

[lints]
workspace = true
