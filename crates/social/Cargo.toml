[package]
name = "drx-social"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["std", "arithmetic", "schnorr", "ecdh"] }
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
base64 = "0.22"
hex = "0.4"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1"
flate2 = "1"

[dev-dependencies]
drx-core.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
