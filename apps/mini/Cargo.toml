[package]
name = "drxwnify-mini"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Drxwnify Mini: light native desktop player"

[dependencies]
unicode-normalization = "0.1"
drx-app.workspace = true
drx-core.workspace = true
drx-catalog.workspace = true
drx-lyrics.workspace = true
drx-platform.workspace = true
drx-together.workspace = true
drx-integrations.workspace = true
drx-social.workspace = true
base64 = "0.22"
# URLs are ASCII here: the IDNA adapter without the ICU tables (~0.3 MB smaller).
idna_adapter = "=1.0.0"
# The patched copy in vendor/ (developer frame hook, see perf.rs).
i-slint-backend-winit = { version = "=1.18.1", default-features = false }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-path", "unstable-winit-030"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros"] }
tracing = "0.1"

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"

[lints]
workspace = true
