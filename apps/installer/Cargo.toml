[package]
name = "drxwnify-mini-setup"
description = "Installer of Drxwnify Mini for Windows (per user, no administrator rights)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
drx-platform = { path = "../../crates/platform" }
# xz (C liblzma, linked statically): Mini packed ~27 % smaller than with deflate.
liblzma = { version = "0.4", default-features = false, features = ["static"] }

[build-dependencies]
liblzma = { version = "0.4", default-features = false, features = ["static"] }

