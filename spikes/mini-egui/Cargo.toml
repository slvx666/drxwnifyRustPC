[package]
name = "spike-egui"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
heavy = { path = "../heavy" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
