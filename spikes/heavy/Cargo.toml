[package]
name = "heavy"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
rquickjs = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
opus = "0.4"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis"] }
serde_json = "1"
